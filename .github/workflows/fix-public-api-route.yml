name: Fix Public API Route
on:
  push:
    paths:
      - '.github/workflows/fix-public-api-route.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Route page directly to Alaska API
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old='fetch(`/api/aurora?region=${encodeURIComponent(id)}`'
          new='fetch(`https://alaska-aurora-live.vercel.app/api/aurora?region=${encodeURIComponent(id)}`'
          if old not in s and new not in s:
              raise SystemExit('Expected API fetch call not found')
          p.write_text(s.replace(old,new))
          PY
          npm test
          npm run build
      - name: Verify production API
        run: |
          curl -L --fail --silent --show-error --max-time 30 'https://alaska-aurora-live.vercel.app/api/aurora?region=fairbanks' -o /tmp/aurora.json
          node -e "const d=require('/tmp/aurora.json'); if(d?.state?.name!=='Alaska'||!d?.fetched_at) process.exit(1)"
      - name: Commit route fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Route Alaska page directly to state API'
          git push
